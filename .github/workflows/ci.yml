name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Test code nodes and DSL structure
        run: pytest -q
      - name: Re-score the recorded runs
        run: |
          python evals/score.py
          cat evals/report.md >> "$GITHUB_STEP_SUMMARY"
